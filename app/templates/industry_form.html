{% extends "base.html" %}{% block content %}
<h1>{{ 'Edit' if p else 'New' }} industry</h1>
<form class="card" method="post" action="{{ '/industries/' ~ p.id if p else '/industries' }}"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<div class="grid g2">
<div><label>Name</label><input type="text" name="name" value="{{ p.name if p }}" required></div>
<div><label>Slug</label><input type="text" name="slug" value="{{ p.slug if p }}" {{ 'readonly' if p }} required><div class="help">Short id, e.g. healthcare</div></div>
</div>
<label>Google Places search phrases (comma or new line separated)</label>
<textarea name="places_queries">{{ p.places_queries|join('\n') if p }}</textarea>
<div class="help">Each phrase is searched in each campaign city: "&lt;phrase&gt; in &lt;city&gt;, Bangladesh". Places returns max 60 results per phrase.</div>
<label>Default decision-maker titles (most senior first)</label>
<textarea name="default_titles">{{ p.default_titles|join('\n') if p }}</textarea>
<label>Pitch context (used by AI personalisation)</label><input type="text" name="pitch_context" value="{{ p.pitch_context if p }}">
<div style="margin-top:12px"><button class="btn primary">Save</button> <a class="btn" href="/industries">Cancel</a></div>
</form>{% endblock %}
