<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · BD Lead Generation</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%230f6b4f%27/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/app.css"></head><body>
<div class="login card">
  <h1>BD Lead Generation</h1>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% if no_users %}<div class="warn">No admin user yet. Create one on the server:<br><span class="mono">python -m scripts.create_admin you@example.com</span></div>{% endif %}
  <form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Email</label><input type="email" name="email" required autofocus>
    <label>Password</label><input type="password" name="password" required>
    <div style="margin-top:14px"><button class="btn primary">Sign in</button></div>
  </form>
</div></body></html>
