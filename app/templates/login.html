<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · BD Lead Generation</title>
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css"></head><body>
<div class="login">
  <div class="brand" style="padding:0 0 18px"><span class="logo">BD</span> Lead Generation</div>
  <div class="card">
    <h1 style="margin-bottom:6px">Sign in</h1>
    <p class="muted">Admin panel for company discovery, decision makers and outreach.</p>
    {% for kind, msg in flashes %}<div class="callout {{ 'err' if kind == 'err' else 'info' }}">{{ msg }}</div>{% endfor %}
    {% if no_users %}<div class="callout warn">No admin user yet. On the server run:<br><span class="mono">python -m scripts.create_admin you@example.com</span></div>{% endif %}
    <form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label for="email">Email</label><input id="email" type="email" name="email" required autofocus autocomplete="username">
      <label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password">
      <div class="form-actions"><button class="btn primary" style="width:100%;justify-content:center">Sign in</button></div>
    </form>
  </div>
</div></body></html>
